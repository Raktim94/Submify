SHORTDESC='Self-hosted form backend with a submission inbox (runs in Docker)'
LONGDESC=' Submify is a self-hosted form backend: a project submission inbox, exports,
 client portals, booking, optional SMTP and Telegram alerts and S3-compatible
 uploads. This package installs a systemd service that runs the published,
 version-pinned Submify containers and a PostgreSQL database with Docker
 Compose, keeping all data in Docker volumes on this machine. Open
 http://localhost:2512 after installing.
 .
 Settings are in /etc/submify/submify.env. Upgrade with apt; back up your data
 first.'
